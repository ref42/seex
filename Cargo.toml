[package]
name = "seex"
version = "4.0.0"
edition = "2024"
description = "A clipboard event tracker and EDA library exporter."
license-file = "LICENSE"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[dependencies]
arboard = "3.7.0"
cfb = "0.16.0"
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
dark-light = "3.0.0"
directories = "6.0.0"
encoding_rs = "0.8.44"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.35"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
gpui-kit = "=0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[build-dependencies]
resvg = "0.49.0"
